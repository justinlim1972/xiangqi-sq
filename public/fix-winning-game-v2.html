<!DOCTYPE html>
<html>
<head>
    <title>🔧 Fix Winning Game v2 - With Detailed Logging</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
        }
        h1 { color: #10b981; font-size: 32px; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; font-size: 16px; margin-bottom: 30px; }
        .step {
            background: #1e293b;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #64748b;
        }
        .step.active {
            border-left-color: #3b82f6;
            background: #1e3a8a;
        }
        .step.done {
            border-left-color: #10b981;
            background: #065f46;
        }
        .step.error {
            border-left-color: #ef4444;
            background: #7f1d1d;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #3b82f6;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        code {
            background: #0f172a;
            padding: 3px 8px;
            border-radius: 4px;
            color: #10b981;
            font-family: 'Courier New', monospace;
        }
        .error-details {
            background: #450a0a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        .success-box {
            background: #065f46;
            border: 2px solid #10b981;
            padding: 25px;
            margin: 30px 0;
            border-radius: 12px;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 20px 10px 20px 0;
            font-size: 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>🔧 Fix Winning Game v2</h1>
    <div class="subtitle">Detailed logging to diagnose the issue</div>

    <div id="output">
        <div class="step active">
            <div class="loading"></div>
            <span>Initializing Firebase and checking login...</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDq_LECOrc4SY90SyDsBQGmwl-YnUNFIj8",
            authDomain: "xiangqi-sq.firebaseapp.com",
            projectId: "xiangqi-sq",
            storageBucket: "xiangqi-sq.firebasestorage.app",
            messagingSenderId: "351923336298",
            appId: "1:351923336298:web:e7278ea095ba085ac4935b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "sg-xiangqi";

        const output = document.getElementById('output');

        function addStep(html, status = 'active') {
            const div = document.createElement('div');
            div.className = `step ${status}`;
            div.innerHTML = html;
            output.appendChild(div);
            return div;
        }

        function updateLastStep(html, status) {
            const lastStep = output.lastElementChild;
            if (lastStep) {
                lastStep.className = `step ${status}`;
                lastStep.innerHTML = html;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                updateLastStep(`❌ <strong>Not logged in!</strong><br>Please log in first.`, 'error');
                return;
            }

            updateLastStep(`✅ Logged in as: <code>${user.email}</code><br>UID: <code>${user.uid}</code>`, 'done');

            const redUid = "OQXCLt4YmlXFoTGLD4MvpRN5utc2";
            const blackUid = "7Ab3sPTyZRNCdkmeYDzOOlq4Tn2";
            const gameId = "WIN_MANUAL_1737914832";

            try {
                // Step 1: Verify we're the right user
                addStep(`<div class="loading"></div> Verifying user...`, 'active');
                if (user.uid !== redUid) {
                    updateLastStep(`❌ <strong>Wrong user!</strong><br>You are: <code>${user.uid}</code><br>Expected: <code>${redUid}</code><br>Please log in as imyeeshun@live.com`, 'error');
                    return;
                }
                updateLastStep(`✅ User verified: 行百里半九十`, 'done');

                // Step 2: Check if game already exists
                addStep(`<div class="loading"></div> Checking if winning game already exists...`, 'active');
                const checkRef = doc(db, 'artifacts', appId, 'users', redUid, 'game-history', gameId);
                try {
                    const checkSnap = await getDoc(checkRef);
                    if (checkSnap.exists()) {
                        updateLastStep(`⚠️ Game already exists! Document found in Firebase.`, 'done');
                        addStep(`Game was already saved. Check your game records page.`, 'done');
                        return;
                    }
                    updateLastStep(`✅ Game does not exist yet. Will create it.`, 'done');
                } catch (checkErr) {
                    updateLastStep(`❌ Permission error when checking: <code>${checkErr.code}</code><div class="error-details">${checkErr.message}</div>`, 'error');
                    addStep(`<strong>FIRESTORE RULES BLOCKING READ ACCESS</strong><br>You need to update Firestore rules to allow reading game-history.`, 'error');
                    return;
                }

                // Step 3: Prepare game data
                addStep(`<div class="loading"></div> Preparing game record...`, 'active');
                const gameRecord = {
                    gameId: gameId,
                    regionId: "Onmr4zpqo2bFwu442ED4",
                    playerRed: {
                        uid: redUid,
                        playerName: "行百里半九十",
                        email: "imyeeshun@live.com"
                    },
                    playerBlack: {
                        uid: blackUid,
                        playerName: "CHSPrimary",
                        email: ""
                    },
                    winner: "red",
                    reason: "resignation",
                    completedAt: 1737914832000,
                    movesICCS: ["h2e2", "b9c7", "b2b6", "i9i4", "h0g2", "h7g7", "b0c2", "a9a5", "i0i1", "a6a5", "a0a1", "b7e7", "g3g4", "g6g5", "i1i6", "e9g7", "g4g5", "h9g7", "g2e3", "i6i1", "b6e6", "a5a4", "e3g4", "g9e7", "e6e7", "e7e4", "g4f6", "e4e6", "i6h6", "e6e5", "h6h3", "i1h1", "e0e1", "e5e9", "e2e8", "g7f5", "e8e1", "e9i9", "f6e4", "i4i0", "e4f6", "f5e7", "f6e4", "i0i1", "e4d6", "i1i2", "d6i1", "c7e8", "i1i2", "e8c9", "e1e8", "h1g1", "e8c8", "c9e7", "c8c1"],
                    movesChinese: ["炮二平五", "馬８進７", "馬二進三", "車９進８", "炮八進六", "炮２平５", "馬八進七", "車１進２", "車九進八", "車１平４", "兵六进五", "炮８進６", "車九平八", "象７進９", "兵七进一", "炮８退４", "兵七进六", "車４進２", "車八进六", "炮８平４", "馬七進八", "炮４平６", "炮六进七", "車８進５", "炮七進七", "士４進５", "馬八進六", "炮５平６", "炮五進四", "將５進４", "炮五退二", "炮６進５", "相七進五", "炮５進２", "兵三进一", "車８退７", "馬三進四", "車７進１", "車一进二", "車７进六", "炮五进六", "將４進５", "馬四進三", "車６退２", "炮六进五", "將５進４", "馬六退五", "車６退１", "炮五退九", "馬１退３", "馬三進１", "炮６退９", "車二進６", "馬７退８", "炮九进二", "馬８進６", "車二平一"],
                    pgnNotation: "[Event \"SG Xiangqi Match\"]\n[Site \"xiangqi-sq.web.app\"]\n[Date \"2026.01.26\"]\n[Round \"1\"]\n[Red \"行百里半九十\"]\n[Black \"CHSPrimary\"]\n[Result \"1-0\"]\n\n1. C25 H8+7 2. H2+3 R98 3. C86 C25 4. H8+7 R1+2 5. R98 R14 6. A6+5 H2+1 7. P7+1 P7+1 8. R1+1 C8+6 9. R8+5 E7+9 10. P7+1 C8-4 11. P76 R4+2 12. R86 C84 13. H7+8 C46 14. C67 R8+5 15. C7+7 A4+5 16. H8+6 C56 17. C5+4 K54 18. C5-2 C65 19. E7+5 C5+2 20. P3+1 R87 21. H3+4 R7+1 22. R12 R76 23. C56 K45 24. H4+3 R6-2 25. C65 K54 26. H6-5 R6-1 27. C59 H1-3 28. H3+1 C69 29. R2+6 H7-8 30. C92 H8+6 31. R21 1-0",
                    fenStart: "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1",
                    fenEnd: "2bak4/4a4/4b4/p1p3p1p/2n6/9/6P1P/1C2N4/4A4/R1BAK1B1R w - - 0 1",
                    totalMoves: 31,
                    duration: 1800000,
                    source: "pc",
                    eloChanges: {
                        red: { oldRating: 1201, newRating: 1216, change: 15 },
                        black: { oldRating: 1200, newRating: 1184, change: -16 }
                    }
                };
                updateLastStep(`✅ Game record prepared with 31 moves`, 'done');

                // Step 4: Save to Red player
                addStep(`<div class="loading"></div> Saving to 行百里半九十's game-history...`, 'active');
                const redGameRef = doc(db, 'artifacts', appId, 'users', redUid, 'game-history', gameId);
                console.log('Attempting to write to path:', 'artifacts/sg-xiangqi/users/' + redUid + '/game-history/' + gameId);

                try {
                    await setDoc(redGameRef, gameRecord);
                    updateLastStep(`✅ Game saved to 行百里半九十's game-history`, 'done');
                } catch (saveErr) {
                    updateLastStep(`❌ <strong>FAILED TO SAVE!</strong><br>Error: <code>${saveErr.code}</code><div class="error-details">${saveErr.message}</div>`, 'error');
                    addStep(`<strong>FIRESTORE RULES ARE BLOCKING WRITE ACCESS</strong><br><br>Current path: <code>artifacts/sg-xiangqi/users/${redUid}/game-history/${gameId}</code><br><br>You must update Firestore Security Rules to allow authenticated users to write to game-history.`, 'error');
                    return;
                }

                // Step 5: Save to Black player
                addStep(`<div class="loading"></div> Saving to CHSPrimary's game-history...`, 'active');
                const blackGameRef = doc(db, 'artifacts', appId, 'users', blackUid, 'game-history', gameId);

                try {
                    await setDoc(blackGameRef, gameRecord);
                    updateLastStep(`✅ Game saved to CHSPrimary's game-history`, 'done');
                } catch (saveErr) {
                    updateLastStep(`❌ Failed to save to CHSPrimary: <code>${saveErr.code}</code>`, 'error');
                    addStep(`Saved to your history but failed for opponent. This might be OK if opponent has different permissions.`, 'done');
                }

                // Step 6: Update profiles
                addStep(`<div class="loading"></div> Updating player profiles...`, 'active');

                const redProfileRef = doc(db, 'artifacts', appId, 'users', redUid, 'profile', 'data');
                const blackProfileRef = doc(db, 'artifacts', appId, 'users', blackUid, 'profile', 'data');

                try {
                    await setDoc(redProfileRef, {
                        elo: 1216,
                        gamesPlayed: 2,
                        lastGameAt: Date.now()
                    }, { merge: true });
                    updateLastStep(`✅ Your profile updated: ELO 1201 → 1216 (+15)`, 'done');
                } catch (profErr) {
                    updateLastStep(`⚠️ Could not update profile: <code>${profErr.code}</code>`, 'error');
                }

                try {
                    addStep(`<div class="loading"></div> Updating opponent profile...`, 'active');
                    await setDoc(blackProfileRef, {
                        elo: 1184,
                        gamesPlayed: 2,
                        lastGameAt: Date.now()
                    }, { merge: true });
                    updateLastStep(`✅ CHSPrimary profile updated: ELO 1200 → 1184 (-16)`, 'done');
                } catch (profErr) {
                    updateLastStep(`⚠️ Could not update opponent profile (this is OK)`, 'done');
                }

                // Success!
                const successDiv = document.createElement('div');
                successDiv.className = 'success-box';
                successDiv.innerHTML = `
                    <h2 style="margin-top: 0; color: #10b981;">🎉 SUCCESS! Your winning game has been recovered!</h2>
                    <div style="margin: 20px 0; font-size: 20px;">
                        📊 <strong>Your Stats:</strong><br>
                        • Total Games: <strong>2</strong><br>
                        • Wins: <strong>1</strong> (Red vs CHSPrimary - Resignation)<br>
                        • Draws: <strong>1</strong><br>
                        • ELO Rating: <strong>1216</strong> (+16 from start)
                    </div>
                    <a href="game/games_records.html" class="btn">📋 View Game Records</a>
                    <a href="check-games.html" class="btn" style="background: #059669;">🔍 Verify in Firebase</a>
                `;
                output.appendChild(successDiv);

            } catch (error) {
                addStep(`❌ <strong>Unexpected Error:</strong><br><code>${error.message}</code><div class="error-details">${error.stack}</div>`, 'error');
                console.error("Unexpected error:", error);
            }
        });
    </script>
</body>
</html>
