<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Game Records - SG Xiangqi</title>
    <style>
        :root {
            --primary: #cd3333;
            --dark: #2c3e50;
            --bg: #f0f2f5;
            --gold: #f1c40f;
            --success: #10b981;
            --info: #3b82f6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Filter Buttons */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 2px solid #e2e8f0;
            color: #334155;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
        }

        /* Games List */
        .games-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .game-card {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            transition: 0.2s;
            cursor: pointer;
        }

        .game-card:last-child {
            border-bottom: none;
        }

        .game-card:hover {
            background: #f8fafc;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-players {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .player-red {
            color: var(--primary);
        }

        .player-black {
            color: #000;
        }

        .game-result {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .result-win {
            background: #dcfce7;
            color: #166534;
        }

        .result-loss {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-draw {
            background: #f1f5f9;
            color: #475569;
        }

        .game-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #64748b;
        }

        .game-detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e2e8f0;
            background: white;
            color: #334155;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.2s;
            padding: 0 10px;
        }

        .page-btn:hover:not(.active):not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            padding: 0 10px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 0.95rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .game-details {
                flex-direction: column;
                gap: 8px;
            }

            .pagination {
                gap: 4px;
            }

            .page-btn {
                min-width: 36px;
                height: 36px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>My Game Records</h1>
    <a href="../lobby/lobby.html" class="btn-back">Back to Lobby</a>
</header>

<div class="container">
    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Games</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Red Wins</div>
            <div class="stat-value" id="stat-wins" style="color: #cd3333;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Black Wins</div>
            <div class="stat-value" id="stat-losses" style="color: #000;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Draws</div>
            <div class="stat-value" id="stat-draws" style="color: #64748b;">0</div>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="app.filterGames('all')">All Games</button>
        <button class="filter-btn" onclick="app.filterGames('red-wins')">Red Wins</button>
        <button class="filter-btn" onclick="app.filterGames('black-wins')">Black Wins</button>
        <button class="filter-btn" onclick="app.filterGames('draws')">Draws Only</button>
    </div>

    <!-- Games List -->
    <div class="games-list" id="games-list">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading all game records...</p>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

class GamesRecordsApp {
    constructor() {
        const config = {
            apiKey: "AIzaSyDq_LECOrc4SY90SyDsBQGmwl-YnUNFIj8",
            authDomain: "xiangqi-sq.firebaseapp.com",
            databaseURL: "https://xiangqi-sq-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "xiangqi-sq",
            storageBucket: "xiangqi-sq.firebasestorage.app",
            messagingSenderId: "351923336298",
            appId: "1:351923336298:web:e7278ea095ba085ac4935b"
        };

        this.fb = initializeApp(config);
        this.auth = getAuth(this.fb);
        this.db = getFirestore(this.fb);
        this.appId = 'sg-xiangqi';

        this.user = null;
        this.allGames = [];
        this.currentFilter = 'all';
        this.currentPage = 1;
        this.gamesPerPage = 10;

        this.init();
    }

    init() {
        onAuthStateChanged(this.auth, (user) => {
            if (user) {
                this.user = user;
                console.log('User logged in:', user.uid);
                this.loadGames();
            } else {
                console.log('No user logged in, redirecting to lobby...');
                window.location.href = '../lobby/lobby.html';
            }
        });
    }

    async loadGames() {
        try {
            console.log('Loading my games from centralized collection...');

            const centralRef = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'all-game-history');
            const centralSnap = await getDocs(centralRef);

            const myUid = this.user.uid;
            this.allGames = [];
            centralSnap.forEach(doc => {
                const game = doc.data();
                // Only include games where the logged-in player participated
                if (game.playerRed?.uid === myUid || game.playerBlack?.uid === myUid) {
                    this.allGames.push(game);
                }
            });

            // Sort in memory (newest first)
            this.allGames.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

            console.log(`Loaded ${this.allGames.length} of my games from centralized collection`);

            this.updateStats();
            this.renderGames();

        } catch (error) {
            console.error('Error loading games:', error);
            document.getElementById('games-list').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">Error</div>
                    <div class="empty-state-title">Error Loading Games</div>
                    <div class="empty-state-text">${error.message}</div>
                </div>
            `;
        }
    }

    updateStats() {
        let redWins = 0;
        let blackWins = 0;
        let draws = 0;

        this.allGames.forEach(game => {
            if (game.winner === 'draw') {
                draws++;
            } else if (game.winner === 'red') {
                redWins++;
            } else if (game.winner === 'black') {
                blackWins++;
            }
        });

        document.getElementById('stat-total').textContent = this.allGames.length;
        document.getElementById('stat-wins').textContent = redWins;
        document.getElementById('stat-losses').textContent = blackWins;
        document.getElementById('stat-draws').textContent = draws;
    }

    filterGames(filter) {
        this.currentFilter = filter;
        this.currentPage = 1; // Reset to first page on filter change

        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        this.renderGames();
    }

    getFilteredGames() {
        if (this.currentFilter === 'all') return this.allGames;

        return this.allGames.filter(game => {
            if (this.currentFilter === 'red-wins') return game.winner === 'red';
            if (this.currentFilter === 'black-wins') return game.winner === 'black';
            if (this.currentFilter === 'draws') return game.winner === 'draw';
            return true;
        });
    }

    goToPage(page) {
        const filtered = this.getFilteredGames();
        const totalPages = Math.ceil(filtered.length / this.gamesPerPage);
        this.currentPage = Math.max(1, Math.min(page, totalPages));
        this.renderGames();

        // Scroll to top of games list
        document.getElementById('games-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    renderPagination(totalGames) {
        const container = document.getElementById('pagination');
        const totalPages = Math.ceil(totalGames / this.gamesPerPage);

        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        const startGame = (this.currentPage - 1) * this.gamesPerPage + 1;
        const endGame = Math.min(this.currentPage * this.gamesPerPage, totalGames);

        let html = '';

        // Previous button
        html += `<button class="page-btn" onclick="app.goToPage(${this.currentPage - 1})" ${this.currentPage === 1 ? 'disabled' : ''}>Prev</button>`;

        // Page numbers - show smart range
        const maxVisible = 5;
        let startPage = Math.max(1, this.currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);

        // Adjust start if we're near the end
        if (endPage - startPage < maxVisible - 1) {
            startPage = Math.max(1, endPage - maxVisible + 1);
        }

        // First page + ellipsis
        if (startPage > 1) {
            html += `<button class="page-btn" onclick="app.goToPage(1)">1</button>`;
            if (startPage > 2) {
                html += `<span class="page-info">...</span>`;
            }
        }

        // Page number buttons
        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" onclick="app.goToPage(${i})">${i}</button>`;
        }

        // Last page + ellipsis
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += `<span class="page-info">...</span>`;
            }
            html += `<button class="page-btn" onclick="app.goToPage(${totalPages})">${totalPages}</button>`;
        }

        // Next button
        html += `<button class="page-btn" onclick="app.goToPage(${this.currentPage + 1})" ${this.currentPage === totalPages ? 'disabled' : ''}>Next</button>`;

        // Page info
        html += `<span class="page-info">${startGame}-${endGame} of ${totalGames}</span>`;

        container.innerHTML = html;
    }

    renderGames() {
        const container = document.getElementById('games-list');
        const filteredGames = this.getFilteredGames();

        if (filteredGames.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎮</div>
                    <div class="empty-state-title">No Games Found</div>
                    <div class="empty-state-text">
                        ${this.currentFilter === 'all'
                            ? 'No games have been played yet!'
                            : `No ${this.currentFilter} recorded yet.`}
                    </div>
                </div>
            `;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        // Paginate
        const startIndex = (this.currentPage - 1) * this.gamesPerPage;
        const endIndex = startIndex + this.gamesPerPage;
        const pageGames = filteredGames.slice(startIndex, endIndex);

        let html = '';

        pageGames.forEach((game, idx) => {
            let resultClass = 'result-draw';
            let resultText = 'DRAW';

            if (game.winner === 'red') {
                resultClass = 'result-win';
                resultText = 'RED WINS';
            } else if (game.winner === 'black') {
                resultClass = 'result-loss';
                resultText = 'BLACK WINS';
            }

            const gameDate = new Date(game.completedAt).toLocaleDateString('en-SG', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            const duration = this.formatDuration(game.duration);
            const gameNumber = startIndex + idx + 1;

            // Show ELO changes for both players
            let eloDisplay = '';
            if (game.eloChanges) {
                const redChange = game.eloChanges.red;
                const blackChange = game.eloChanges.black;
                const redColor = redChange.change >= 0 ? '#10b981' : '#ef4444';
                const blackColor = blackChange.change >= 0 ? '#10b981' : '#ef4444';
                const redSign = redChange.change >= 0 ? '+' : '';
                const blackSign = blackChange.change >= 0 ? '+' : '';

                eloDisplay = `
                    <div class="game-detail-item" style="color:${redColor}; font-weight:700;">
                        ELO ${redChange.oldRating} > ${redChange.newRating} (${redSign}${redChange.change})
                    </div>
                    <div class="game-detail-item" style="color:${blackColor}; font-weight:700;">
                        ELO ${blackChange.oldRating} > ${blackChange.newRating} (${blackSign}${blackChange.change})
                    </div>
                `;
            }

            html += `
                <div class="game-card" onclick="app.viewGame('${game.gameId}')">
                    <div class="game-header">
                        <div class="game-players">
                            <span style="color:#94a3b8; font-size:0.8rem; font-weight:600;">#${gameNumber}</span>
                            <span class="player-red">${game.playerRed?.playerName || 'Red'}</span>
                            <span> vs </span>
                            <span class="player-black">${game.playerBlack?.playerName || 'Black'}</span>
                        </div>
                        <div class="game-result ${resultClass}">${resultText}</div>
                    </div>
                    <div class="game-details">
                        <div class="game-detail-item">${gameDate}</div>
                        <div class="game-detail-item">${game.totalMoves} moves</div>
                        <div class="game-detail-item">${duration}</div>
                        <div class="game-detail-item">${game.source === 'mobile' ? 'Mobile' : 'PC'}</div>
                        <div class="game-detail-item">${this.formatReason(game.reason)}</div>
                        ${eloDisplay}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // Render pagination
        this.renderPagination(filteredGames.length);
    }

    formatDuration(ms) {
        if (!ms || ms <= 0) return '0m';
        const minutes = Math.floor(ms / 60000);
        if (minutes < 60) {
            return `${minutes}m`;
        }
        const hours = Math.floor(minutes / 60);
        const remainingMinutes = minutes % 60;
        return `${hours}h ${remainingMinutes}m`;
    }

    formatReason(reason) {
        const reasons = {
            'checkmate': 'Checkmate',
            'resignation': 'Resignation',
            'draw': 'Draw',
            'timeout': 'Timeout',
            'perpetual-check': 'Perpetual Check',
            'perpetual-chase': 'Perpetual Chase',
            'stalemate': 'Stalemate'
        };
        return reasons[reason] || reason || 'Unknown';
    }

    viewGame(gameId) {
        window.location.href = `game_preview.html?id=${gameId}`;
    }
}

// Initialize app
window.app = new GamesRecordsApp();
</script>

</body>
</html>
