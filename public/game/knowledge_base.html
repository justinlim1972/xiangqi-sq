/* ===== Firebase: Save Game ===== */
async function saveGame() {
    if (!currentUser) { showToast('Not authenticated', 'error'); return; }
    if (loadedGameId && !isGameOwner()) { showToast('You cannot modify games created by others', 'error'); return; }
    if (moves.length === 0) { showToast('At least 1 move is required to save', 'error'); return; }

    const details = getDetailsFromForm();
    const docData = {
        createdBy: currentUser.uid,
        createdByName: (userProfile && userProfile.name) || currentUser.email,
        createdAt: loadedGameId ? undefined : Date.now(),
        updatedAt: Date.now(),
        gameTitle: details.gameTitle,
        redPlayer: details.redPlayer,
        blackPlayer: details.blackPlayer,
        datePlayed: details.datePlayed,
        location: details.location,
        result: details.result,
        openingName: details.openingName,
        keywords: details.keywords,
        isPublic: details.isPublic,
        moves: JSON.parse(JSON.stringify(moves)),
        movesICCS: [...movesICCS],
        movesChinese: [...movesChinese],
        totalMoves: moves.length,
        variations: JSON.parse(JSON.stringify(variations)),
        comments: JSON.parse(JSON.stringify(comments)),
        thumbsUp: loadedGameId ? undefined : [],
        thumbsDown: loadedGameId ? undefined : []
    };

    // Remove undefined fields
    Object.keys(docData).forEach(k => { if (docData[k] === undefined) delete docData[k]; });

    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        if (loadedGameId) {
            const docRef = doc(db, collPath, loadedGameId);
            await setDoc(docRef, docData, { merge: true });
            showToast('Game updated!', 'success');
        } else {
            const colRef = collection(db, collPath);
            const newDocRef = doc(colRef);
            docData.kbId = newDocRef.id;
            docData.createdAt = Date.now();
            await setDoc(newDocRef, docData);
            loadedGameId = newDocRef.id;
            showToast('Game saved!', 'success');
        }
        openingNamesCache = null;
        await loadMyGames();
    } catch (err) {
        console.error('Save error:', err);
        showToast('Save failed: ' + err.message, 'error');
    }
}

/* ===== Firebase: Load My Games ===== */
async function loadMyGames() {
    if (!currentUser) return;
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        const q = query(collection(db, collPath), where('createdBy', '==', currentUser.uid));
        const snapshot = await getDocs(q);
        allMyGames = [];
        snapshot.forEach(d => {
            allMyGames.push({ id: d.id, ...d.data() });
        });
        allMyGames.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
        if (currentGamesView === 'mine') renderPaginatedGames();
    } catch (err) {
        console.error('Load games error:', err);
    }
}

function renderMyGames(games) { renderPaginatedGames(); }

function renderPaginatedGames() {
    const games = currentGamesView === 'mine' ? allMyGames : allPublicGames;
    const totalPages = Math.ceil(games.length / gamesPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    const startIdx = (currentPage - 1) * gamesPerPage;
    const pageGames = games.slice(startIdx, startIdx + gamesPerPage);
    document.getElementById('my-games-count').textContent = games.length;
    const badge = document.getElementById('game-count-badge');
    if (badge) badge.textContent = (currentGamesView === 'mine' ? allMyGames.length + ' games' : allPublicGames.length + ' public');
    renderGameCards(pageGames);
    renderPaginationControls(totalPages);
}

function renderGameCards(games) {
    const container = document.getElementById('games-list');
    if (games.length === 0) {
        const msg = currentGamesView === 'mine' ? 'No games saved yet.' : 'No public games available.';
        container.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px 10px; font-size:0.85rem;">${msg}</div>`;
        return;
    }
    container.innerHTML = games.map(g => generateGameCardHTML(g)).join('');
}

function generateGameCardHTML(g) {
    const resultMap = {
        'red-win': { text: 'Red Win', cls: 'result-red-win' },
        'black-win': { text: 'Black Win', cls: 'result-black-win' },
        'draw': { text: 'Draw', cls: 'result-draw' },
        'no-result': { text: 'No Result', cls: 'result-no-result' }
    };
    const res = resultMap[g.result] || resultMap['no-result'];
    const dateStr = g.datePlayed || (g.createdAt ? new Date(g.createdAt).toLocaleDateString() : 'Unknown');

    // Omit default player names
    const redP = (g.redPlayer && g.redPlayer !== 'Red') ? g.redPlayer : null;
    const blackP = (g.blackPlayer && g.blackPlayer !== 'Black') ? g.blackPlayer : null;
    let playersHTML;
    if (redP && blackP) {
        playersHTML = `<span style="color:var(--primary)">${escHtml(redP)}</span><span class="vs">vs</span><span>${escHtml(blackP)}</span>`;
    } else if (redP) {
        playersHTML = `<span style="color:var(--primary)">${escHtml(redP)}</span> <span class="vs">(Red)</span>`;
    } else if (blackP) {
        playersHTML = `<span>${escHtml(blackP)}</span> <span class="vs">(Black)</span>`;
    } else {
        playersHTML = '';
    }

    const visIcon = g.isPublic ? '&#128275;' : '&#128274;';
    const visText = g.isPublic ? 'Public' : 'Private';
    const title = g.gameTitle ? `<div class="game-card-title">${escHtml(g.gameTitle)}</div>` : '';
    const creatorName = g.createdByName || 'Unknown';
    const openingHeading = g.openingName ? `<div class="game-card-opening">${escHtml(g.openingName)}</div>` : '';

    const isOwner = currentUser && g.createdBy === currentUser.uid;

    // Voting
    const thumbsUp = g.thumbsUp || [];
    const thumbsDown = g.thumbsDown || [];
    const upCount = thumbsUp.length;
    const downCount = thumbsDown.length;
    const userVote = currentUser ? (thumbsUp.includes(currentUser.uid) ? 'up' : (thumbsDown.includes(currentUser.uid) ? 'down' : null)) : null;

    let votingHTML = '';
    if (!isOwner) {
        votingHTML = `<div class="voting-ui">
            <button class="vote-btn ${userVote === 'up' ? 'voted-up' : ''}" onclick="window.kbApp.vote('${g.id}','up')">&#128077; ${upCount}</button>
            <button class="vote-btn ${userVote === 'down' ? 'voted-down' : ''}" onclick="window.kbApp.vote('${g.id}','down')">&#128078; ${downCount}</button>
        </div>`;
    } else if (upCount > 0 || downCount > 0) {
        votingHTML = `<div class="vote-count-display"><span>&#128077; ${upCount}</span><span>&#128078; ${downCount}</span></div>`;
    }

    // Action buttons — only owner gets Make Private/Public + Delete
    let actionsHTML;
    if (isOwner) {
        actionsHTML = `<div class="game-card-actions">
            <button class="btn-load" onclick="window.kbApp.loadGame('${g.id}')">Load</button>
            <button class="btn-export" onclick="window.kbApp.exportPGN('${g.id}')">Export</button>
            <button class="btn-toggle-vis" onclick="window.kbApp.toggleVisibility('${g.id}', ${!g.isPublic})">${g.isPublic ? 'Make Private' : 'Make Public'}</button>
            <button class="btn-delete" onclick="window.kbApp.confirmDelete('${g.id}')">Delete</button>
        </div>`;
    } else {
        actionsHTML = `<div class="game-card-actions">
            <button class="btn-load" onclick="window.kbApp.loadGame('${g.id}')">Load</button>
            <button class="btn-export" onclick="window.kbApp.exportPGN('${g.id}')">Export</button>
        </div>`;
    }

    return `
    <div class="game-card" data-id="${g.id}">
        ${openingHeading}
        ${title}
        <div class="game-card-creator">by <span class="creator-name">${escHtml(creatorName)}</span></div>
        ${playersHTML ? `<div class="game-card-header"><div class="game-card-players">${playersHTML}</div><span class="result-badge ${res.cls}">${res.text}</span></div>` : `<div class="game-card-header"><span class="result-badge ${res.cls}">${res.text}</span></div>`}
        <div class="game-card-meta">
            <span>&#128197; ${escHtml(dateStr)}</span>
            <span>&#9823; ${g.totalMoves || 0} moves</span>
            <span class="visibility-icon">${visIcon} ${visText}</span>
        </div>
        ${votingHTML}
        ${actionsHTML}
    </div>`;
}

function renderPaginationControls(totalPages) {
    const container = document.getElementById('games-list');
    if (totalPages <= 1) return;
    const paginationHTML = `<div class="pagination-controls">
        <button class="page-btn" id="btn-prev-page" ${currentPage <= 1 ? 'disabled' : ''}>&#9664; Prev</button>
        <span class="page-info">Page ${currentPage} of ${totalPages}</span>
        <button class="page-btn" id="btn-next-page" ${currentPage >= totalPages ? 'disabled' : ''}>Next &#9654;</button>
    </div>`;
    container.insertAdjacentHTML('beforeend', paginationHTML);
    document.getElementById('btn-prev-page')?.addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderPaginatedGames(); document.getElementById('games-list').scrollTop = 0; }
    });
    document.getElementById('btn-next-page')?.addEventListener('click', () => {
        if (currentPage < totalPages) { currentPage++; renderPaginatedGames(); document.getElementById('games-list').scrollTop = 0; }
    });
}

function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

/* ===== Firebase: Load Single Game ===== */
async function loadGame(gameId) {
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        const docRef = doc(db, collPath, gameId);
        const snap = await getDoc(docRef);
        if (!snap.exists()) { showToast('Game not found', 'error'); return; }
        const data = snap.data();

        // Reset state
        board = engine.init();
        moves = data.moves || [];
        movesICCS = data.movesICCS || [];
        movesChinese = data.movesChinese || [];
        comments = data.comments || {};
        variations = data.variations || {};
        currentMoveIndex = -1;
        currentTurn = 'red';
        selectedPiece = null;
        lastMove = null;
        loadedGameId = gameId;
        loadedGameCreator = data.createdBy || null;
        isRecordingVariation = false;
        viewingVariation = null;
        variationRecordingContext = null;
        expandedVariations = {};

        // Replay all moves
        if (moves.length > 0) {
            replayToIndex(moves.length - 1);
        } else {
            render();
            renderMovesListWithExpansion();
        }

        populateDetailsForm(data);
        updateVariationUI();
        updateCommentArea();

        // Hide save button for non-owners
        document.getElementById('btn-save-game').style.display = isGameOwner() ? '' : 'none';

        // Switch to moves tab
        switchTab('moves');
        showToast('Game loaded!', 'success');
    } catch (err) {
        console.error('Load game error:', err);
        showToast('Load failed: ' + err.message, 'error');
    }
}

/* ===== Firebase: Delete Game ===== */
function confirmDelete(gameId) {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
        <div class="confirm-dialog">
            <h3>Delete Game?</h3>
            <p>This action cannot be undone. The game record will be permanently removed.</p>
            <div class="btn-row">
                <button class="btn-cancel" id="btn-cancel-del">Cancel</button>
                <button class="btn-confirm" id="btn-confirm-del">Delete</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);

    document.getElementById('btn-cancel-del').onclick = () => overlay.remove();
    document.getElementById('btn-confirm-del').onclick = async () => {
        overlay.remove();
        await deleteGame(gameId);
    };
}

async function deleteGame(gameId) {
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        await deleteDoc(doc(db, collPath, gameId));
        if (loadedGameId === gameId) {
            loadedGameId = null;
            newGame();
        }
        await loadMyGames();
        showToast('Game deleted', 'success');
    } catch (err) {
        console.error('Delete error:', err);
        showToast('Delete failed: ' + err.message, 'error');
    }
}

/* ===== Firebase: Toggle Visibility ===== */
async function toggleVisibility(gameId, makePublic) {
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        await setDoc(doc(db, collPath, gameId), { isPublic: makePublic, updatedAt: Date.now() }, { merge: true });
        await loadMyGames();
        showToast(makePublic ? 'Game is now public' : 'Game is now private', 'info');
    } catch (err) {
        console.error('Toggle visibility error:', err);
        showToast('Update failed: ' + err.message, 'error');
    }
}

/* ===== Public Games + Voting ===== */
async function loadPublicGames() {
    if (!currentUser) return;
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        const q = query(collection(db, collPath), where('isPublic', '==', true));
        const snapshot = await getDocs(q);
        allPublicGames = [];
        snapshot.forEach(d => { allPublicGames.push({ id: d.id, ...d.data() }); });
        allPublicGames.sort((a, b) => {
            const aScore = (a.thumbsUp?.length || 0) - (a.thumbsDown?.length || 0);
            const bScore = (b.thumbsUp?.length || 0) - (b.thumbsDown?.length || 0);
            if (aScore !== bScore) return bScore - aScore;
            return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
        });
        if (currentGamesView === 'public') renderPaginatedGames();
    } catch (err) {
        console.error('Load public games error:', err);
    }
}

async function vote(gameId, voteType) {
    if (!currentUser) return;
    try {
        const collPath = `artifacts/${appId}/public/data/knowledge-base`;
        const docRef = doc(db, collPath, gameId);

        // Find in cache to check current vote
        const game = allPublicGames.find(g => g.id === gameId) || allMyGames.find(g => g.id === gameId);
        if (!game) return;

        const thumbsUp = game.thumbsUp || [];
        const thumbsDown = game.thumbsDown || [];
        const currentVote = thumbsUp.includes(currentUser.uid) ? 'up'
                          : thumbsDown.includes(currentUser.uid) ? 'down'
                          : null;

        const updates = {};
        if (voteType === 'up') {
            if (currentVote === 'up') {
                updates.thumbsUp = arrayRemove(currentUser.uid);
            } else {
                updates.thumbsUp = arrayUnion(currentUser.uid);
                if (currentVote === 'down') updates.thumbsDown = arrayRemove(currentUser.uid);
            }
        } else {
            if (currentVote === 'down') {
                updates.thumbsDown = arrayRemove(currentUser.uid);
            } else {
                updates.thumbsDown = arrayUnion(currentUser.uid);
                if (currentVote === 'up') updates.thumbsUp = arrayRemove(currentUser.uid);
            }
        }

        await setDoc(docRef, updates, { merge: true });

        // Update local cache immediately for responsiveness
        if (voteType === 'up') {
            if (currentVote === 'up') {
                game.thumbsUp = thumbsUp.filter(uid => uid !== currentUser.uid);
            } else {
                if (!game.thumbsUp) game.thumbsUp = [];
                game.thumbsUp.push(currentUser.uid);
                if (currentVote === 'down') game.thumbsDown = (game.thumbsDown || []).filter(uid => uid !== currentUser.uid);
            }
        } else {
            if (currentVote === 'down') {
                game.thumbsDown = thumbsDown.filter(uid => uid !== currentUser.uid);
            } else {
                if (!game.thumbsDown) game.thumbsDown = [];
                game.thumbsDown.push(currentUser.uid);
                if (currentVote === 'up') game.thumbsUp = (game.thumbsUp || []).filter(uid => uid !== currentUser.uid);
            }
        }

        renderPaginatedGames();
        showToast(voteType === 'up' ? '👍 Vote recorded' : '👎 Vote recorded', 'info');
    } catch (err) {
        console.error('Vote error:', err);
        showToast('Vote failed: ' + err.message, 'error');
    }
}

/* ===== PGN Export ===== */
function generateVariationPGN(v) {
    let text = '(';
    if (v.label) text += `{${v.label}} `;
    const vICCS = v.movesICCS || [];
    const vChinese = v.movesChinese || [];
    const vComments = v.comments || {};
    const vVariations = v.variations || {};
    vICCS.forEach((vm, vi) => {
        text += vm;
        if (vChinese[vi]) text += ` {${vChinese[vi]}}`;
        if (vComments[vi.toString()]) text += ` {${vComments[vi.toString()]}}`;
        // Recurse into sub-variations at this move
        if (vVariations[vi.toString()]) {
            vVariations[vi.toString()].forEach(sv => {
                text += ' ' + generateVariationPGN(sv);
            });
        }
        if (vi < vICCS.length - 1) text += ' ';
    });
    text += ')';
    return text;
}

function generatePGN(data) {
    const resultMap = { 'red-win': '1-0', 'black-win': '0-1', 'draw': '1/2-1/2', 'no-result': '*' };
    const result = resultMap[data.result] || '*';
    const date = data.datePlayed ? data.datePlayed.replace(/-/g, '.') : '????.??.??';
    const redPlayer = data.redPlayer || 'Red';
    const blackPlayer = data.blackPlayer || 'Black';

    // PGN headers
    let pgn = '';
    pgn += `[Game "Chinese Chess"]\n`;
    pgn += `[Event "${data.gameTitle || data.openingName || 'Knowledge Base Game'}"]\n`;
    pgn += `[Site "${data.location || 'SG Xiangqi'}"]\n`;
    pgn += `[Date "${date}"]\n`;
    pgn += `[Red "${redPlayer}"]\n`;
    pgn += `[Black "${blackPlayer}"]\n`;
    pgn += `[Result "${result}"]\n`;
    if (data.openingName) pgn += `[Opening "${data.openingName}"]\n`;
    pgn += `[FEN "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1"]\n`;
    pgn += '\n';

    // Move text with comments and variations
    const iccs = data.movesICCS || [];
    const chinese = data.movesChinese || [];
    const gameComments = data.comments || {};
    const gameVariations = data.variations || {};
    let moveText = '';

    for (let i = 0; i < iccs.length; i++) {
        const moveNum = Math.floor(i / 2) + 1;
        if (i % 2 === 0) {
            moveText += `${moveNum}. `;
        }

        // Use ICCS notation as the primary move format, with Chinese as comment
        moveText += iccs[i];

        // Add Chinese notation as inline comment
        if (chinese[i]) {
            moveText += ` {${chinese[i]}}`;
        }

        // Add user comment
        if (gameComments[i.toString()]) {
            moveText += ` {${gameComments[i.toString()]}}`;
        }

        // Add variations (recursive)
        if (gameVariations[i.toString()]) {
            const vars = gameVariations[i.toString()];
            vars.forEach(v => {
                moveText += ' ' + generateVariationPGN(v);
            });
        }

        moveText += ' ';
    }

    moveText += result;
    pgn += moveText.trim() + '\n';
    return pgn;
}

async function exportPGN(gameId) {
    // Find game from allMyGames cache or load from Firebase
    let gameData = allMyGames.find(g => g.id === gameId);
    if (!gameData) {
        try {
            const collPath = `artifacts/${appId}/public/data/knowledge-base`;
            const snap = await getDoc(doc(db, collPath, gameId));
            if (!snap.exists()) { showToast('Game not found', 'error'); return; }
            gameData = snap.data();
        } catch (err) {
            showToast('Failed to load game for export', 'error');
            return;
        }
    }

    const pgn = generatePGN(gameData);
    const filename = (gameData.gameTitle || gameData.openingName || 'xiangqi_game').replace(/[^a-zA-Z0-9_\-\s]/g, '').replace(/\s+/g, '_') + '.pgn';

    // Download as file
    const blob = new Blob([pgn], { type: 'application/x-chess-pgn' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Exported as ${filename}`, 'success');
}

function exportCurrentGamePGN() {
    if (moves.length === 0) { showToast('No moves to export', 'error'); return; }
    const details = getDetailsFromForm();
    const data = {
        ...details,
        moves: moves,
        movesICCS: movesICCS,
        movesChinese: movesChinese,
        comments: comments,
        variations: variations
    };
    const pgn = generatePGN(data);
    const filename = (details.gameTitle || details.openingName || 'xiangqi_game').replace(/[^a-zA-Z0-9_\-\s]/g, '').replace(/\s+/g, '_') + '.pgn';

    const blob = new Blob([pgn], { type: 'application/x-chess-pgn' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Exported as ${filename}`, 'success');
}

/* ===== Tabs ===== */
function switchTab(name) {
    document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelector(`.sidebar-tab[data-tab="${name}"]`).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
}

/* ===== Search ===== */
function filterGames(searchText) {
    const text = searchText.toLowerCase();
    const sourceGames = currentGamesView === 'mine' ? allMyGames : allPublicGames;
    if (!text) {
        currentPage = 1;
        renderPaginatedGames();
        return;
    }
    const filtered = sourceGames.filter(g => {
        const fields = [
            g.gameTitle, g.redPlayer, g.blackPlayer, g.openingName,
            g.location, g.createdByName, ...(g.keywords || [])
        ].filter(Boolean).map(f => f.toLowerCase());
        return fields.some(f => f.includes(text));
    });
    currentPage = 1;
    const totalPages = Math.ceil(filtered.length / gamesPerPage) || 1;
    const pageGames = filtered.slice(0, gamesPerPage);
    document.getElementById('my-games-count').textContent = filtered.length;
    renderGameCards(pageGames);
    renderPaginationControls(totalPages);
}

    t.className = `toast toast-${type}`;

    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
