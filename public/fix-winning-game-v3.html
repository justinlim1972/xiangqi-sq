<!DOCTYPE html>
<html>

    <style>

            padding: 40px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            max-width: 1200px;

        h1 { color: #10b981; }
        .step {
            background: #1e293b;
            padding: 15px 20px;

        .step.active { border-left-color: #3b82f6; background: #1e3a8a; }
        code { background: #0f172a; padding: 3px 8px; border-radius: 4px; color: #10b981; }
        .success-box {
            background: #065f46;
            border: 2px solid #10b981;
            padding: 25px;
            margin: 30px 0;
            border-radius: 12px;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 20px 10px 20px 0;
            font-size: 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;

</head>
<body>

        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        });

        const auth = getAuth(app);
        const db = getFirestore(app);
        const output = document.getElementById('output');

        function addStep(html, status = 'active') {
            const div = document.createElement('div');
            div.className = `step ${status}`;
            div.innerHTML = html;
            output.appendChild(div);
            return div;
        }

        onAuthStateChanged(auth, async (user) => {
